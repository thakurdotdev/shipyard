<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Offline · ShipYard</title>
    <style>
      :root { color-scheme: light dark; --bg: #fafafa; --fg: #0a0a0b; --muted: #6b6b70; --border: #e4e4e7; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0a0a0b; --fg: #fafafa; --muted: #a1a1aa; --border: #27272a; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { max-width: 22rem; text-align: center; }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 18px; margin: 16px 0 4px; }
      p { color: var(--muted); margin: 0 0 20px; }
      button {
        font: inherit; font-weight: 500; color: var(--fg); background: transparent;
        border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>ShipYard needs a connection to show builds and deployments. It reconnects on its own.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
