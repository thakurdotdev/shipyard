[fmt]
printWidth = 100
tabWidth = 2
semi = true
singleQuote = true
trailingComma = "all"
ignorePatterns = [
  "node_modules",
  "dist",
  "/build",
  ".next",
  ".bun",
  "coverage",
  "apps/**/builds",
  # Generated by Next (static export and type stubs); bun fmt doesn't read packages/ui/.gitignore.
  "packages/ui/out",
  "packages/ui/next-env.d.ts",
  "packages/deploy-engine/apps",
]

[lint]
ignorePatterns = [
  "node_modules",
  "dist",
  "/build",
  ".next",
  ".bun",
  "coverage",
  "apps/**/builds",
  "packages/deploy-engine/apps",
]

[test]
# Keeps deploy-engine tests off the real apps directory and server Nginx rules.
preload = ["./packages/deploy-engine/src/test-preload.ts"]
